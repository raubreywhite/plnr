url: https://www.rwhite.no/plnr/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package · Analysis planning"
      title: "Plan and run many analyses."
      lede: >
        Load the data once, or once for each key, then run one function over
        many argsets: strata, exposures or outcomes. Run the analyses in sequence or in
        <em>parallel</em>.
      cta:
        primary:
          text: "Get started"
          href: "articles/plnr.html"
        secondary:
          text: "Browse the reference →"
          href: "reference/index.html"

articles:
- title: "Get started"
  navbar: ~
  contents:
  - plnr
  - adding_analyses
- title: "Case study: many registries"
  navbar: ~
  contents:
  - articles/case-study
  - articles/case-study-contract
  - articles/case-study-methods
  - articles/case-study-pipeline

reference:
- title: "Plan Management"
  desc: "Classes and functions related to defining and managing an analysis plan."
  contents:
    - Plan

- title: "Utility Functions"
  desc: "General-purpose utility functions for various tasks."
  contents:
    - expand_list
    - get_anything
    - is_run_directly
    - set_opts

- title: "Testing Functions"
  desc: "Functions designed for testing analysis workflows."
  contents:
    - example_action_fn
    - example_data_fn_nor_covid19_cases_by_time_location
    - nor_covid19_cases_by_time_location
    - test_action_fn

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors. :pray:"
  Richard Aubrey White:
    href: "https://www.rwhite.no"
