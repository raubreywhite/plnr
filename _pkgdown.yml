url: https://www.rwhite.no/plnr/

template:
  package: rwtemplate
  params:
    hero:
      overline: "R package · Analysis planning"
      title: "Plan and fan out analyses."
      lede: >
        Load data once, then run one function across a cross-product of
        argsets — strata, exposures, outcomes — with hash-based caching and
        optional <em>parallel</em> execution.
      cta:
        primary:
          text: "Get started"
          href: "articles/plnr.html"
        secondary:
          text: "Browse the reference →"
          href: "reference/index.html"

reference:
- title: "Plan Management"
  desc: "Classes and functions related to defining and managing an analysis plan."
  contents:
    - Plan

- title: "Utility Functions"
  desc: "General-purpose utility functions for various tasks."
  contents:
    - expand_list
    - get_anything
    - is_run_directly
    - set_opts
    - try_again

- title: "Project Creation"
  desc: "Functions for setting up and managing example RMarkdown projects."
  contents:
    - create_rmarkdown

- title: "Testing Functions"
  desc: "Functions designed for testing analysis workflows."
  contents:
    - example_action_fn
    - example_data_fn_nor_covid19_cases_by_time_location
    - nor_covid19_cases_by_time_location
    - test_action_fn

authors:
  footer:
    roles: [cre, aut]
    text: "Crafted by"
  sidebar:
    roles: [cre, aut, cph]
  before: "This package is proudly brought to you by:"
  after: "See the [changelog](news/index.html) for other contributors. :pray:"
  Richard Aubrey White:
    href: "https://www.rwhite.no"
